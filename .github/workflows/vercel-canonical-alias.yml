name: Assign Canonical Vercel Production Alias

on:
  deployment_status:
  workflow_dispatch:

jobs:
  assign-canonical-alias:
    name: Sync workforce-platform.vercel.app Alias
    # Run for manual dispatch or successful production deployments initiated by Vercel
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        github.event.deployment_status.creator.login == 'vercel[bot]' &&
        (
          contains(github.event.deployment.environment, 'Production') ||
          contains(github.event.deployment.environment, 'production')
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-canonical-alias
      cancel-in-progress: false
    steps:
      - name: Install Pinned Vercel CLI
        run: npm install -g vercel@65.14.0

      - name: Verify Promoted Deployment and Assign Alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node -e '
          const https = require("https");
          const { spawnSync } = require("child_process");

          const token = process.env.VERCEL_TOKEN;
          const orgId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;

          // 1. Guard against missing credentials
          if (!token || !orgId || !projectId) {
            console.error("FATAL: Missing required Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID).");
            process.exit(1);
          }

          function vercelGet(path) {
            return new Promise((resolve, reject) => {
              const req = https.get({
                hostname: "api.vercel.com",
                path,
                headers: {
                  Authorization: `Bearer ${token}`,
                  "User-Agent": "GitHub-Actions-Canonical-Alias"
                }
              }, (res) => {
                let body = "";
                res.on("data", chunk => body += chunk);
                res.on("end", () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    return reject(new Error(`Vercel API error (${res.statusCode}) on ${path}: ${body}`));
                  }
                  try {
                    resolve(JSON.parse(body));
                  } catch (err) {
                    reject(new Error(`Failed to parse response from ${path}: ${err.message}`));
                  }
                });
              });
              req.on("error", reject);
            });
          }

          async function getPromotedProduction() {
            const project = await vercelGet(`/v9/projects/${projectId}?teamId=${orgId}`);
            const prod = project.targets?.production;
            if (!prod || !prod.url || !prod.id) {
              throw new Error("No active production deployment target found on project.");
            }
            return prod;
          }

          async function main() {
            const MAX_ATTEMPTS = 3;
            let attempt = 0;
            let lastAssignedId = null;
            let lastAssignedUrl = null;

            while (attempt < MAX_ATTEMPTS) {
              attempt++;
              console.log(`==> [Attempt ${attempt}/${MAX_ATTEMPTS}] Resolving active promoted production deployment...`);
              const candidateProd = await getPromotedProduction();

              console.log(`Target: ${candidateProd.url}`);
              console.log(`Deployment ID: ${candidateProd.id}`);
              console.log(`Ready State: ${candidateProd.readyState}`);
              console.log(`Created At: ${new Date(candidateProd.createdAt).toISOString()}`);

              // 2. Verify candidate deployment is READY
              if (candidateProd.readyState !== "READY") {
                console.error(`FATAL: Candidate deployment is not READY (state: ${candidateProd.readyState}). Refusing to alias.`);
                process.exit(1);
              }

              // 3. Inspect current alias state to prevent rollbacks or redundant operations
              console.log("==> Inspecting current alias state for workforce-platform.vercel.app...");
              const aliasData = await vercelGet(`/v4/aliases?teamId=${orgId}`);
              const currentAlias = (aliasData.aliases || []).find(a => a.alias === "workforce-platform.vercel.app");

              if (currentAlias) {
                console.log(`Current assigned deployment: ${currentAlias.deployment?.url || currentAlias.deploymentId}`);

                // Anti-stale rollback guard against currently assigned deployment
                if (currentAlias.deployment?.createdAt && candidateProd.createdAt) {
                  if (candidateProd.createdAt < currentAlias.deployment.createdAt) {
                    console.error("FATAL: Candidate deployment is older than currently assigned deployment. Refusing backwards assignment.");
                    process.exit(1);
                  }
                }

                // If candidate is already assigned and no newer target is found, exit cleanly
                if (currentAlias.deploymentId === candidateProd.id || currentAlias.deployment?.url === candidateProd.url) {
                  console.log("SUCCESS: Alias workforce-platform.vercel.app is already pointing to this deployment.");
                  return;
                }
              }

              // 4. Pre-assignment double-fetch race-condition safeguard
              console.log("==> Performing immediate pre-assignment target re-verification...");
              const freshProd = await getPromotedProduction();
              let targetToAssign = candidateProd;

              if (freshProd.id !== candidateProd.id) {
                console.log(`NOTICE: Production target changed concurrently: ${candidateProd.id} -> ${freshProd.id}`);
                if (freshProd.readyState === "READY" && freshProd.createdAt >= candidateProd.createdAt) {
                  console.log(`Adopting newer READY production target: ${freshProd.url} (${freshProd.id})`);
                  targetToAssign = freshProd;
                } else {
                  console.error(`FATAL: Concurrent production target ${freshProd.id} is not verified READY (${freshProd.readyState}) or is older. Aborting safely without changing alias.`);
                  process.exit(1);
                }
              } else {
                if (freshProd.readyState !== "READY") {
                  console.error(`FATAL: Pre-assignment verification shows deployment is no longer READY (${freshProd.readyState}). Aborting.`);
                  process.exit(1);
                }
              }

              // 5. Safe process execution using spawnSync with argument array (no shell, no credentials in argv)
              console.log(`==> Executing alias assignment to ${targetToAssign.url}...`);
              const cliArgs = ["alias", "set", targetToAssign.url, "workforce-platform.vercel.app", "--scope", orgId];
              const result = spawnSync("vercel", cliArgs, {
                encoding: "utf8",
                env: process.env,
                stdio: "pipe"
              });

              if (result.stdout) {
                console.log(result.stdout.trim());
              }

              if (result.status !== 0) {
                console.error("FATAL: Vercel CLI alias command failed with exit code:", result.status);
                if (result.stderr) {
                  console.error(result.stderr.trim());
                }
                process.exit(result.status || 1);
              }

              lastAssignedId = targetToAssign.id;
              lastAssignedUrl = targetToAssign.url;

              // 6. Post-assignment check for newer promoted target (bounded retry loop)
              console.log("==> Performing post-assignment production target check...");
              const postProd = await getPromotedProduction();

              if (postProd.id !== lastAssignedId) {
                console.log(`NOTICE: A newer production target was promoted during/after assignment (${lastAssignedId} -> ${postProd.id}).`);
                if (postProd.readyState === "READY" && postProd.createdAt > targetToAssign.createdAt) {
                  console.log(`Newer deployment is READY. Retrying alias assignment using newer target (attempt ${attempt + 1}/${MAX_ATTEMPTS})...`);
                  continue;
                } else {
                  console.error(`FATAL: Newer production deployment ${postProd.id} is not READY (${postProd.readyState}). Aborting safely.`);
                  process.exit(1);
                }
              }

              // 7. Post-assignment verification: Confirmed mismatch produces non-zero exit code
              console.log("==> Verifying updated alias mapping...");
              const verifyData = await vercelGet(`/v4/aliases?teamId=${orgId}`);
              const updatedAlias = (verifyData.aliases || []).find(a => a.alias === "workforce-platform.vercel.app");

              if (updatedAlias?.deploymentId === lastAssignedId || updatedAlias?.deployment?.url === lastAssignedUrl) {
                console.log(`SUCCESS: Confirmed workforce-platform.vercel.app successfully points to promoted deployment ${lastAssignedUrl} (${lastAssignedId}).`);
                return;
              } else {
                console.error(`FATAL: Alias mismatch detected! Expected deployment ${lastAssignedId} (${lastAssignedUrl}), but alias records indicate: ${updatedAlias?.deploymentId || "none"} (${updatedAlias?.deployment?.url || "none"}).`);
                process.exit(1);
              }
            }

            console.error(`FATAL: Exceeded maximum attempts (${MAX_ATTEMPTS}) due to continuous concurrent promotions. Aborting safely.`);
            process.exit(1);
          }

          main().catch(err => {
            console.error("FATAL Execution Error:", err.message);
            process.exit(1);
          });
          '
